name: Docker-free native Ubuntu server portal
on:
  pull_request:
    paths:
      - 'scripts/native-preview-install.sh'
      - 'scripts/native-preview-refresh.sh'
      - 'scripts/ci-native-preview-smoke.mjs'
      - 'src/**'
      - 'web/**'
      - 'scripts/migrate-db.mjs'
      - 'scripts/bootstrap-owner.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-preview-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-portal:
    name: Ubuntu host PostgreSQL systemd (NO Docker) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      DOMYRO_CI_NATIVE_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ONLY native Ubuntu PostgreSQL (no Docker, no containers)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql postgresql-client
          sudo systemctl enable --now postgresql.service
          sudo -u postgres psql -X -qAt -d postgres -c "SELECT current_setting('server_version_num')"
      - name: Prepare locked Node dependencies outside root context
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Reject invalid native setup script before privileged test
        run: |
          bash -n scripts/native-preview-install.sh scripts/native-preview-refresh.sh
          node --check scripts/ci-native-preview-smoke.mjs
      - name: Run Docker-free native installation and authenticated portal smoke
        run: node scripts/ci-native-preview-smoke.mjs
      - name: Verify dev-only gate stays closed
        run: node scripts/check-installation-gate.mjs
