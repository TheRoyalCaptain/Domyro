name: Disposable native systemd integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transient-systemd:
    name: CI-only native systemd service / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      DOMYRO_CI_SYSTEMD_ALLOWED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify CI-only transient systemd start and restart
        run: bash scripts/ci-real-systemd-test.sh
  dedicated-native-account:
    name: CI-only dedicated service account / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      DOMYRO_CI_SYSTEMD_ALLOWED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify isolated native system account and real systemd unit
        run: bash scripts/ci-native-account-test.sh

  native-postgres-onboarding:
    name: CI-only native PostgreSQL + owner / \${{ matrix.os }}
    runs-on: \${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: domyro_test
          POSTGRES_PASSWORD: ci-throwaway-test-only
          POSTGRES_DB: domyro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domyro_test -d domyro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DOMYRO_CI_SYSTEMD_ALLOWED: '1'
      DOMYRO_CI_PG_ONBOARDING: '1'
      DOMYRO_TEST_DATABASE_URL: postgresql://domyro_test:ci-throwaway-test-only@127.0.0.1:5432/domyro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact integrity-locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise native systemd with isolated PostgreSQL schema and owner login
        run: bash scripts/ci-native-account-test.sh
