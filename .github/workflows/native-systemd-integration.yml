name: Disposable native systemd integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transient-systemd:
    name: CI-only native systemd service / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      DOMYRO_CI_SYSTEMD_ALLOWED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify CI-only transient systemd start and restart
        run: bash scripts/ci-real-systemd-test.sh
