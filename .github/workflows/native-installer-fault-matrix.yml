name: Disposable native installer failure matrix
on:
  pull_request:
    paths:
      - 'scripts/ci-native-account-test.sh'
      - 'scripts/ci-native-firstboot-evidence.mjs'
      - 'scripts/ci-stage-signed-source.mjs'
      - 'src/lifecycle/native-firstboot-journal.mjs'
      - 'scripts/ci-native-installer-fault-matrix.sh'
      - 'scripts/ci-native-sigkill-recovery.sh'
      - '.github/workflows/native-installer-fault-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer-failpoints:
    name: CI-only installer cleanup / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: domyro_test
          POSTGRES_PASSWORD: ci-throwaway-test-only
          POSTGRES_DB: domyro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domyro_test -d domyro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DOMYRO_CI_SYSTEMD_ALLOWED: '1'
      DOMYRO_CI_PG_ONBOARDING: '1'
      DOMYRO_CI_FAULT_MATRIX: '1'
      DOMYRO_TEST_DATABASE_URL: postgresql://domyro_test:ci-throwaway-test-only@127.0.0.1:5432/domyro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check CI-only scripts
        run: bash -n scripts/ci-native-account-test.sh scripts/ci-native-installer-fault-matrix.sh scripts/ci-native-sigkill-recovery.sh
          node --check scripts/ci-native-firstboot-evidence.mjs
      - name: Abort four first-install phases and verify complete disposable cleanup
        run: bash scripts/ci-native-installer-fault-matrix.sh
      - name: SIGKILL installer, verify preserved owner data, refuse retry, explicitly recover
        run: bash scripts/ci-native-sigkill-recovery.sh
