name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / unit and isolated release tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        node: ['22', '24']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: domyro_test
          POSTGRES_PASSWORD: ci-throwaway-test-only
          POSTGRES_DB: domyro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domyro_test -d domyro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DOMYRO_TEST_DATABASE_URL: postgresql://domyro_test:ci-throwaway-test-only@127.0.0.1:5432/domyro_test
      # Explicitly allow Docker-backed PostgreSQL 17 CLI backup/restore tests
      # against new disposable databases in CI. Never set this on owner hosts.
      DOMYRO_PG_CLI_TEST: '1'
      DOMYRO_NATIVE_DEPS_TEST: '1'
      DOMYRO_SYSTEMD_VERIFY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install exact integrity-locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax-check CI-only native systemd scripts
        run: bash -n scripts/ci-real-systemd-test.sh scripts/ci-native-account-test.sh
      - run: npm run check
      - name: Read-only host diagnostic (informational, no install)
        run: npm run preflight:read-only
